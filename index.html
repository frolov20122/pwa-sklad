<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  
  <!-- Подключение манифеста -->
  <link rel="manifest" href="/pwa-sklad/manifest.json">
  
  <!-- Мета-теги для iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Склад">
  <link rel="apple-touch-icon" href="/pwa-sklad/icon-192.png">
  
  <!-- Цвет темы -->
  <meta name="theme-color" content="#27ae60">
  
  <title>Складской учёт</title>
  
  <style>
    /* Сброс отступов */
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f0f2f5;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      /* Для iOS: убираем возможные отступы */
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    /* Если на телефоне адресная строка перекрывает, это решит viewport-fit=cover */
  </style>
</head>
<body>
  <!-- ВСТАВЬТЕ ВАШ URL APPS SCRIPT -->
  <iframe src="https://script.google.com/macros/s/AKfycbxYdiSbdu4MkgPnJbC9KuehZmiS_5m1VThhvQ9phnr32BpsVkndS01R2SZXh72gD5foAg/exec"></iframe>
  
  <script>
    // Регистрация service worker для офлайн-режима
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker зарегистрирован'))
        .catch(err => console.log('Ошибка SW:', err));
    }
  </script>
</body>
</html>
