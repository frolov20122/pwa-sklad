<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  
  <!-- Отключаем кэширование страницы -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  
  <!-- Подключение манифеста -->
  <link rel="manifest" href="/pwa-sklad/manifest.json">
  
  <!-- Мета-теги для iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Склад">
  <link rel="apple-touch-icon" href="/pwa-sklad/icon-192.png">
  
  <!-- Цвет темы -->
  <meta name="theme-color" content="#27ae60">

  <link rel="icon" type="image/png" sizes="32x32" href="/pwa-sklad/favicon-32x32.png">
  
  <title>Складской учёт</title>
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f0f2f5;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>
<body>
  <script>
    // Добавляем параметр ?nocache с меткой времени, чтобы избежать кэширования iframe
    var appsScriptUrl = 'https://script.google.com/macros/s/AKfycbyveE0ND-4avR-p-6T9Nd_Y7U5nYN7VJuTct_PHFSd_dLIW4roS1fv8k_FhUkZb-8HO9g/exec';
    var iframe = document.createElement('iframe');
    iframe.src = appsScriptUrl + '?nocache=' + Date.now();
    iframe.style.cssText = 'display:block; width:100%; height:100%; border:none; position:fixed; top:0; left:0; right:0; bottom:0;';
    document.body.appendChild(iframe);
  </script>
  
  <script>
    // Регистрация service worker для офлайн-режима
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker зарегистрирован'))
        .catch(err => console.log('Ошибка SW:', err));
    }
  </script>
</body>
</html>
